name: Game checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 build.py --web-only
      - run: python3 tools/check_repository.py
      - run: npm test
      - run: npm run check
      - run: npm run test:browser
      - run: npm run test:campaign
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-output
          path: tests/.output/
          include-hidden-files: true
          retention-days: 7
